# MINIMAL registry to try the harness on any operating system.
#
# Cardiff XLM-R only, which comes from the Hugging Face Hub (~1.1 GB the first time) and runs on
# CPU. It does not include the Laya models: those need local paths or heavier downloads and, for
# the CoreML adapter, macOS with Apple Silicon. For the full registry, see config.yaml.

service:
  host: 127.0.0.1
  port: 8090

delegation:
  default_threshold: 0.75
  per_type:
    noul: 0.75
  neutral_mass_threshold: 0.70

routing:
  noul: cardiff-xlmr

preload: [cardiff-xlmr]

models:
  cardiff-xlmr:
    label: "Cardiff XLM-R sentiment (HF classifier, 3 classes reduced to binary)"
    adapter: transformers
    supports: [noul]
    weights: cardiffnlp/twitter-xlm-roberta-base-sentiment
    revision: f2f1202b1bdeb07342385c3f807f9c07cd8f5cf8
    max_length: 512          # XLM-R supports 512; with 128, long text was being lost silently
    expect_sha256: 93316a86051c359748c5d5453e7660c69a21a57cfb477892f95f539e3e171196
    calibration: null
    binary_reduction:
      positive: 2
      negative: 0
    smoke:
      - text: "I love this product, it changed my life!"
        type: noul
        instructions: "Does this text express positive sentiment?"
        expect_value: true
      - text: "El producto llegó roto y nadie responde. Una estafa."
        type: noul
        instructions: "Does this text express positive sentiment?"
        expect_value: false


observability:
  enabled: true
  level: metadata
  excerpt_chars: 160
  directory: logs/decisions
  window: 5000
  retain_days: 30

active: cardiff-xlmr

# Model lifecycle. 0 = never unload: every routed model stays resident, which is what a shared or
# always-on instance wants. On a personal machine they add up to ~1.75 GB that can sit unused for
# days, so unloading them after an idle period trades memory for one slow call afterwards.
lifecycle:
  unload_after_idle_seconds: 0        # e.g. 900 = a quarter of an hour
  check_interval_seconds: 60
