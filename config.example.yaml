# Model registry and routing for the decision service.
#
# The service knows nothing about models: it knows about adapters and per-primitive routes.
#   * `routing` decides which model serves each primitive (noul / choice / score).
#   * `preload` decides which models load at startup; the rest load on first use.
#   * `expect_sha256` is checked against the REAL sha256 of the weights file (not the blob name
#     in the Hugging Face cache, which is not the same thing). If it does not match, that model
#     is not loaded.

service:
  host: 127.0.0.1
  port: 8090

delegation:
  # Per-primitive threshold, applied to the CALIBRATED confidence.
  default_threshold: 0.75
  per_type:
    noul: 0.75
    choice: 0.70
    score: 0.70
  # On top of confidence: if the model believes the text is MORE probably neutral than it is
  # sentiment, it delegates. Measured over 600 genuinely neutral texts (class 1 of the original
  # dataset) and the 1,740 non-neutral ones: AUC 0.81. The threshold was chosen on marginal
  # cost/benefit, recomputed with the rule the service actually runs (neutral_mass > threshold):
  #
  #   threshold   neutrals delegated   extra traffic   local error of the extra
  #   0.50            54.0 %              +12.1 %             19.9 %
  #   0.70            32.7 %               +3.9 %             19.1 %
  #   0.80            17.7 %               +1.1 %             10.5 %
  #
  # Reference: the whole non-neutral set has a 10.3 % local error rate, so the extra traffic
  # carries about twice the average error: delegating it is worth it. 0.50 detects more neutrals
  # but costs three times the traffic for the same marginal error. At 0.70 the marginal cost is
  # negligible.
  neutral_mass_threshold: 0.70

# Which model handles each primitive. With no entry, it falls back to the `active` model.
routing:
  noul: cardiff-xlmr      # sentiment: the best measured (91.7 % on 240 texts)
  choice: laya-base       # general decision engine, zero-shot
  score: laya-base

# Both models that serve a primitive are preloaded: the rest of the registry stays as an
# alternative. Lazy-loading the general model took ~3.7 s and the DSH plugin times out at
# 2.5 s, so the first choice question would have failed on timeout.
preload: [cardiff-xlmr, laya-base]

models:
  cardiff-xlmr:
    label: "Cardiff XLM-R sentiment (clasificador HF, 3 clases reducidas a binario)"
    adapter: transformers
    supports: [noul]
    weights: cardiffnlp/twitter-xlm-roberta-base-sentiment
    revision: f2f1202b1bdeb07342385c3f807f9c07cd8f5cf8
    max_length: 512          # XLM-R supports 512; with 128, long text was being lost silently
    expect_sha256: 93316a86051c359748c5d5453e7660c69a21a57cfb477892f95f539e3e171196
    calibration: null
    binary_reduction:
      positive: 2
      negative: 0
    smoke:
      - text: "I love this product, it changed my life!"
        type: noul
        instructions: "Does this text express positive sentiment?"
        expect_value: true
      - text: "El producto llegó roto y nadie responde. Una estafa."
        type: noul
        instructions: "Does this text express positive sentiment?"
        expect_value: false

  laya-base:
    label: "Laya base (motor de decisión general, zero-shot sobre instrucciones arbitrarias)"
    adapter: laya
    supports: [noul, choice, score]
    weights: convaiinnovations/laya-multilingual
    revision: 82d57fc4f2d1be3d2caac494045f2ec51d0842f3
    expect_sha256: 9d628fd971b700382ac6f65920a86f149777b2e748e0c955fb3b19695aa8f204
    calibration: null
    smoke:
      - text: "Quiero que me devuelvan el dinero de este pedido"
        type: noul
        instructions: "Does this text ask for a refund?"
        expect_value: true
      - text: "Me cobraron dos veces la misma factura y nadie contesta"
        type: choice
        instructions: "Which team should handle this ticket?"
        options: [sales, support, billing, other]
        expect_value: billing

  laya-sentiment-v1:
    label: "Laya sentiment v1 (fine-tune validado, CoreML FP16)"
    adapter: coreml
    supports: [noul]
    weights: ~/modelos/laya-sentiment-v1-coreml   # EDITAR: ruta al paquete CoreML (make setup-full)
    expect_sha256: 1701a2f936d82eaa7a5e3f4da8c236d6f0fe47d03fad9a49f9e5f5a2483d08c9
    calibration: ~/modelos/calibration-v1.json        # EDITAR
    smoke:
      - text: "I love this product, it changed my life!"
        type: noul
        instructions: "Does this text express positive sentiment?"
        expect_value: true

  laya-sentiment-v2:
    label: "Laya sentiment v2 (experimento 4.8x datos, safetensors)"
    adapter: laya
    supports: [noul]
    weights: ~/modelos/laya_sentiment_v2          # EDITAR: checkpoint en safetensors
    expect_sha256: 9f79ac8f9e518d210af4f6f51458d3562d8149935e63c9623831cf4d20fb8142
    calibration: ~/modelos/laya_sentiment_v2          # EDITAR: checkpoint en safetensors/calibration.json
    smoke:
      - text: "I love this product, it changed my life!"
        type: noul
        instructions: "Does this text express positive sentiment?"
        expect_value: true

  laya-poc:
    label: "PoC organizacional (fine-tune de V3, CoreML, 4 clases)"
    adapter: coreml
    supports: [noul, choice, score]
    weights: ~/modelos/laya-multilingual-coreml   # EDITAR
    expect_sha256: 587e4ac81f74c55da0e2c323be47f9a4f901e2dcac3a0fce240f88af91da2af5
    calibration: null
    smoke:
      - text: "Me cobraron dos veces la misma factura y nadie contesta"
        type: choice
        instructions: "Which team should handle this ticket?"
        options: [sales, support, billing, other]
        expect_value: billing

observability:
  enabled: true
  # off: nothing | metadata: numbers and hashes only | excerpt: first characters | full: whole text
  level: excerpt
  excerpt_chars: 160
  directory: logs/decisions
  window: 5000          # in-memory records, so /metrics does not read from disk
  retain_days: 30       # the oldest files are deleted at startup

active: cardiff-xlmr
