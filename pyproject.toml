[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-hybrid-harness"
version = "1.0.0"
description = "Servicio de decisión local agnóstico del modelo, con enrutamiento por primitiva, política de derivación al cloud y observabilidad"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["laya", "coreml", "decision-engine", "hybrid", "delegation", "observability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Only what the service itself needs.
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2",
  "pyyaml>=6",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Demo path: works on any OS (Linux, Windows, macOS Intel/ARM), without CoreML.
demo = [
  "torch>=2.2",
  "transformers>=4.40",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  # protobuf is needed for transformers to extract the vocabulary of a SentencePiece
  # tokenizer. In the author's environment it arrived as a transitive dependency of
  # coremltools, so its absence only showed up in a clean install: the demo failed with
  # "tiktoken is required to read a tiktoken file", a misleading message -- the problem was
  # not tiktoken. It was found by the clean quickstart test (tests/quickstart_clean.sh).
  "protobuf>=4",
]
# Full path: adds the Laya adapters (CoreML needs macOS Apple Silicon).
full = [
  "laya-hybrid-harness[demo]",
  "laya",
  "laya-coreml",
  "pandas>=2",
  "pyarrow>=15",
]

[project.urls]
Homepage = "https://github.com/Ra77Data/laya-hybrid-harness"
"Resultados medidos" = "https://huggingface.co/Ramg77/laya-sentiment-multilingual"

[tool.setuptools.packages.find]
include = ["service*"]
